<body>
  <style>
    /* Critical CSS for Preloader */
    body {
      background-color: #0B0B0B;
      margin: 0;
    }

    .loader-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0B0B0B;
      z-index: 9999;
    }

    .loader-logo {
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Oswald, 'Arial Narrow', sans-serif;
      font-weight: 700;
      font-size: 26px;
      letter-spacing: 0.08em;
      color: #19CE67;
      border: 1px solid rgba(255, 255, 255, 0.12);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(25, 206, 103, 0.35);
      }

      70% {
        box-shadow: 0 0 0 18px rgba(25, 206, 103, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(25, 206, 103, 0);
      }
    }
  </style>
  <div id="root">
    <div class="loader-container">
      <div class="loader-logo">AK</div>
    </div>
  </div>
