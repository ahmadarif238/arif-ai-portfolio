<body>
  <style>
    /* Critical CSS for Preloader */
    body {
      background-color: #030014;
      margin: 0;
    }

    .loader-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #030014;
      z-index: 9999;
    }

    .loader-logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      font-weight: bold;
      font-size: 24px;
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.4);
      }

      70% {
        transform: scale(1.1);
        box-shadow: 0 0 0 20px rgba(168, 85, 247, 0);
      }

      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(168, 85, 247, 0);
      }
    }
  </style>
  <div id="root">
    <div class="loader-container">
      <div class="loader-logo">AK</div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
