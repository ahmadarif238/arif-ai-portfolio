  <style>
    /* Critical CSS for the preloader, shown before React mounts */
    html, body { background: #050003; margin: 0; }
    .loader-container {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 9999;
      background: radial-gradient(120% 90% at 20% 23%, #2d0b23 0%, #12040f 45%, #000 100%);
    }
    .loader-mark { width: 44px; height: 44px; animation: pulse 1.6s infinite ease-in-out; }
    @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.94); } 50% { opacity: 1; transform: scale(1); } }
  </style>
  <div id="root">
    <div class="loader-container">
      <svg class="loader-mark" viewBox="0 0 40 40" fill="none" aria-label="Loading">
        <path d="M20 20V8.5M20 20l10 5.8M20 20l-10 5.8" stroke="#ff488b" stroke-width="2.4" stroke-linecap="round" opacity=".7" />
        <circle cx="20" cy="7.4" r="4.6" fill="#ff488b" /><circle cx="31.2" cy="26.3" r="4.6" fill="#e33adb" />
        <circle cx="8.8" cy="26.3" r="4.6" fill="#ff488b" /><circle cx="20" cy="20" r="4.4" stroke="#ff488b" stroke-width="2.6" />
      </svg>
    </div>
  </div>
