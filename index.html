<body class="bg-[#0b1220] text-white font-sans antialiased selection:bg-[#0bd1d1] selection:text-[#0b1220]">
  <style>
    /* Critical CSS for the preloader, shown before React mounts */
    body {
      background-color: #0b1220;
      margin: 0;
    }

    .loader-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1220;
      z-index: 9999;
    }

    .loader-logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Noto Sans', sans-serif;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 0.06em;
      color: #ffffff;
      background: linear-gradient(to top right, #0ea5ea, #0bd1d1);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(11, 209, 209, 0.4);
      }

      70% {
        box-shadow: 0 0 0 18px rgba(11, 209, 209, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(11, 209, 209, 0);
      }
    }
  </style>
  <div id="root">
    <div class="loader-container">
      <div class="loader-logo">AK</div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
